version: '3.8'

services:

  portainer:
    image: portainer
    container_name: portainer
    build: requirements/bonus/portainer/
    restart: always
    ports:
      - "9000:9000"
    networks:
      - inception
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
  adminer:
    image : adminer
    container_name : adminer
    build : requirements/bonus/adminer/
    restart : always
    networks :
      - inception
    ports:
      - "8080:8080"
    depends_on:
      - mariadb
  redis:
    image : redis
    container_name : redis
    build : requirements/bonus/redis/
    restart : always
    networks :
      - inception
  ftp:
    image: ftp
    container_name: ftp
    build: requirements/bonus/ftp/
    env_file:
      - .env
    restart: always
    depends_on:
      - wordpress  
    environment:
      - FTP_USER=${FTP_USER}
      - FTP_GROUP=${FTP_GROUP}
      - FTP_DATA=${FTP_DATA}  
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - ftp_user_password
  static_site:
    image: static_site
    container_name: static_site
    build: requirements/bonus/static_site/
    restart: always
    networks:
      - inception
  nginx:
    image: nginx
    container_name: nginx
    build: requirements/nginx/
    restart: always
    depends_on:
      - wordpress
      - static_site
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  wordpress:
    image: wordpress
    container_name: wordpress
    build: requirements/wordpress/
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - MYSQL_HOST=${MYSQL_HOST}
      - WP_USER=${WP_USER}
      - WP_ADMIN_USER=${WP_ADMIN_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_URL=${WP_URL}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    restart: always
    depends_on:
      - mariadb
      - redis
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  mariadb:
    image: mariadb
    container_name: mariadb 
    build: requirements/mariadb/
    restart: always
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

networks:
  inception:
    driver: bridge
    name: inception

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/portainer

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt
