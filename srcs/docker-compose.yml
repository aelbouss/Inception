version: '3.8'

services:
  nginx:
    image: nginx
    container_name: nginx
    build: requirements/nginx/
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    networks:
      - inception
  
  wordpress:
    image: wordpress
    container_name: wordpress
    build: requirements/wordpress/
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - MYSQL_HOST=${MYSQL_HOST}
      - WP_USER=${WP_USER}
      - WP_ADMIN_USER=${WP_ADMIN_NAME}
      - WP_TITLE=${WP_TITLE}
      - WP_URL=${WP_URL}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
    secrets:
      - db_password
      - db_user_password
      - wp_admin_password
      - wp_user_password
    restart: always
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  mariadb:
    image: mariadb
    container_name: mariadb 
    build: requirements/mariadb/
    restart: always
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - MYSQL_HOST=${MYSQL_HOST}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  nginx_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/nginx

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt